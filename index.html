<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5046E5" />
    <title>SONGA — Making everyday life easier, one step at a time</title>
    <meta
      name="description"
      content="SONGA is an AI-style daily-life assistant for university students and working adults with ADHD: capture, confirm, remember and follow through."
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235046E5'/%3E%3Cpath d='M16 44h12V32h12V20h8' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div id="app">
      <header class="top">
        <div class="brand">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="16" fill="currentColor" />
            <path
              d="M16 44h12V32h12V20h8"
              stroke="#fff"
              stroke-width="6"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="brand-name">SONGA</span>
        </div>
        <div class="top-r">
          <span id="net" class="tiny muted" aria-live="polite"></span>
          <button
            class="icon-btn"
            data-a="openCapture"
            aria-label="Quick capture"
          >
            ＋
          </button>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Main">
        <button data-a="tab" data-t="today">
          <svg viewBox="0 0 24 24">
            <path
              d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"
            /></svg
          ><span>Today</span>
        </button>
        <button data-a="tab" data-t="calendar">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="5" width="17" height="15" rx="3" />
            <path d="M8 3v4M16 3v4M3.5 10h17" /></svg
          ><span>Calendar</span>
        </button>
        <button class="fab" data-a="openCapture" aria-label="Capture a thought">
          <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" /></svg>
        </button>
        <button data-a="tab" data-t="study">
          <svg viewBox="0 0 24 24">
            <path d="M2.5 9L12 4l9.5 5L12 14z" />
            <path
              d="M6.5 11.5V16c0 1.5 2.5 3 5.5 3s5.5-1.500 5.500-3v-4.500"
            /></svg
          ><span>Study</span>
        </button>
        <button data-a="tab" data-t="me">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c1-4 4-6 8-6s7 2 8 6" /></svg
          ><span>Me</span>
        </button>
      </nav>

      <div id="layer"></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
